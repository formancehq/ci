name: Go Release

on:
  workflow_call:
    secrets:
      NUMARY_GITHUB_TOKEN:
        required: true
      SPEAKEASY_API_KEY:
        required: false
      FURY_TOKEN:
        required: false
      GORELEASER_KEY:
        required: false
      GIT_PRIVATE_TOKEN:
        required: false
    inputs:
      runner-profile:
        description: Namespace runner profile for the release build
        type: string
        default: namespace-profile-linux-amd64-4vcpu
      goreleaser-parallelism:
        description: GoReleaser build parallelism
        type: number
        default: 0
      enable-docker:
        description: Setup GHCR login, QEMU, and Buildx for container builds
        type: boolean
        default: true
      enable-attestations:
        description: Generate SLSA build provenance attestations
        type: boolean
        default: false
      nix-extra-flags:
        description: Extra flags for nix develop
        type: string
        default: ''
      working-directory:
        description: Directory holding the justfile whose `release` recipe runs GoReleaser. The Nix dev shell still comes from the repository root.
        type: string
        default: '.'

permissions:
  contents: write

jobs:
  GoReleaser:
    name: GoReleaser
    runs-on: ${{ inputs.runner-profile }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          dissociate: true

      - name: Setup Nix and caching
        if: ${{ !inputs.enable-docker }}
        uses: formancehq/ci/actions/setup-nix@main
        with:
          nscloud-cache: 'true'
          nix-extra-flags: ${{ inputs.nix-extra-flags }}
          git-private-token: ${{ secrets.GIT_PRIVATE_TOKEN }}

      - name: Setup Nix, caching, and container tooling
        if: ${{ inputs.enable-docker }}
        uses: formancehq/ci/actions/setup-release@main
        with:
          token: ${{ secrets.NUMARY_GITHUB_TOKEN }}
          nscloud-cache: 'true'
          nix-extra-flags: ${{ inputs.nix-extra-flags }}
          git-private-token: ${{ secrets.GIT_PRIVATE_TOKEN }}

      - name: Run release
        # The dev shell is resolved from the repository root; only `just` moves
        # into the working directory, so monorepos release one project per job
        # without duplicating the GoReleaser toolchain in every sub-flake.
        run: |
          # shellcheck disable=SC2016 # the quoted script expands inside the dev shell, not here
          nix develop --impure $NIX_EXTRA_FLAGS \
            --command sh -c 'cd "$WORKING_DIRECTORY" && exec just release $PARALLELISM_FLAG'
        env:
          GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          NIX_EXTRA_FLAGS: ${{ inputs.nix-extra-flags }}
          PARALLELISM_FLAG: ${{ inputs.goreleaser-parallelism > 0 && format('--parallelism={0}', inputs.goreleaser-parallelism) || '' }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}

      - name: Verify release artifacts
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          cd "$WORKING_DIRECTORY"
          echo "::group::GoReleaser artifacts"
          if [ -f dist/artifacts.json ]; then
            echo "Docker images:"
            jq -r '.[] | select(.type == "Docker Image") | "  ✓ \(.name)"' dist/artifacts.json

            echo "Archives:"
            jq -r '.[] | select(.type == "Archive") | "  ✓ \(.name)"' dist/artifacts.json

            echo "Checksums:"
            jq -r '.[] | select(.type == "Checksum") | "  ✓ \(.name)"' dist/artifacts.json

            TOTAL=$(jq length dist/artifacts.json)
            echo ""
            echo "Total artifacts: $TOTAL"

            if [ "$TOTAL" -eq 0 ]; then
              echo "::error::GoReleaser produced zero artifacts"
              exit 1
            fi
          else
            echo "::error::dist/artifacts.json not found — GoReleaser may not have run"
            exit 1
          fi
          echo "::endgroup::"

      - name: Generate attestations
        if: inputs.enable-attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ inputs.working-directory }}/dist/checksums.txt
