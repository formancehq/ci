name: Go PR

on:
  workflow_call:

permissions:
  contents: read

jobs:
  PR:
    if: github.event_name == 'pull_request'
    name: PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
