name: Go Build on Label

# Reusable workflow for label-triggered builds and deploys.
# Callers must trigger on `pull_request: types: [labeled]` and pass
# `github.event.label.name` context via the normal workflow_call mechanism.

on:
  workflow_call:
    inputs:
      build-labels:
        description: JSON array of PR labels that trigger the build
        type: string
        default: '["build-images","deploy-staging"]'
      deploy-label:
        description: PR label that triggers deploy to staging
        type: string
        default: deploy-staging
      deploy-targets:
        description: |
          JSON array of deploy targets. Every target must include "application".
          Simple:  [{"component":"ledger","application":"staging-eu-west-1-hosting-regions"}]
          Custom:  [{"application":"staging-eu-west-1-hosting-foo","parameter":"global.foo.image.tag","source-position":"3"}]
          For custom targets, parameter is the ArgoCD param key without the tag value — the workflow appends =${{ github.sha }} automatically.
        type: string
        default: '[]'
      goreleaser-parallelism:
        description: GoReleaser build parallelism
        type: number
        default: 0
      nix-extra-flags:
        description: Extra flags for nix develop
        type: string
        default: ''
    secrets:
      NUMARY_GITHUB_TOKEN:
        required: true
      SPEAKEASY_API_KEY:
        required: false
      FURY_TOKEN:
        required: false
      GORELEASER_KEY:
        required: false
      GIT_PRIVATE_TOKEN:
        required: false
      ARGOCD_REGION_AUTH_TOKEN:
        required: false
      TS_OIDC_OAUTH_CLIENT_ID:
        required: false
      TS_OIDC_AUDIENCE:
        required: false

jobs:
  GoReleaser:
    if: contains(fromJSON(inputs.build-labels), github.event.label.name) || github.event.label.name == inputs.deploy-label
    uses: formancehq/ci/.github/workflows/go-build.yml@v1
    with:
      build-condition: always
      goreleaser-parallelism: ${{ inputs.goreleaser-parallelism }}
      nix-extra-flags: ${{ inputs.nix-extra-flags }}
    secrets:
      NUMARY_GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
      FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      GIT_PRIVATE_TOKEN: ${{ secrets.GIT_PRIVATE_TOKEN }}

  Deploy:
    if: github.event.label.name == inputs.deploy-label && fromJSON(inputs.deploy-targets)[0] != null
    runs-on: namespace-profile-linux-amd64-2vcpu
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: read
      id-token: write
    needs: GoReleaser
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.deploy-targets) }}
    steps:
      - uses: formancehq/ci/actions/deploy-staging@v1
        with:
          component: ${{ matrix.target.component || '' }}
          tag: ${{ github.sha }}
          application: ${{ matrix.target.application }}
          parameter: ${{ matrix.target.parameter && format('{0}={1}', matrix.target.parameter, github.sha) || '' }}
          source-position: ${{ matrix.target.source-position || '' }}
          auth-token: ${{ secrets.ARGOCD_REGION_AUTH_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OIDC_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          ts-tags: ${{ vars.TS_TAGS }}
          ts-version: ${{ vars.TS_VERSION }}
          ts-args: ${{ vars.TS_ARGS }}
          ts-retry: ${{ vars.TS_RETRY }}
          ts-timeout: ${{ vars.TS_TIMEOUT }}
          ts-ping: ${{ vars.TS_PING }}
