name: Go Test

on:
  workflow_call:
    secrets:
      SPEAKEASY_API_KEY:
        required: false
      NUMARY_GITHUB_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false
      GIT_PRIVATE_TOKEN:
        required: false
      CI_METRICS_TOKEN:
        required: false
    inputs:
      runner-profile:
        description: Namespace runner profile
        type: string
        default: namespace-profile-linux-amd64-8vcpu
      test-target:
        description: Just target for running tests
        type: string
        default: tests
      extra-test-targets:
        description: Space-separated additional just targets to run after the main test target
        type: string
        default: ''
      enable-codecov:
        description: Upload test coverage to Codecov
        type: boolean
        default: false
      coverage-files:
        description: Comma-separated coverage file paths for Codecov
        type: string
        default: ''
      nix-extra-flags:
        description: Extra flags for nix develop
        type: string
        default: ''
      command:
        description: Raw shell command to run instead of just $test-target (e.g. "pnpm run test")
        type: string
        default: ''
      pnpm-cache:
        description: Enable pnpm store caching (for JS/TS repos)
        type: boolean
        default: false
      skip-go:
        description: Skip Go environment extraction and caching (for non-Go repos)
        type: boolean
        default: false
      metrics-push-endpoint:
        description: Victoria Metrics push endpoint URL for CI metrics (skip if empty)
        type: string
        default: ''
      test-results:
        description: Path to Go test JSON output file for test count metrics
        type: string
        default: ''

jobs:
  Test:
    name: Test
    runs-on: ${{ inputs.runner-profile }}
    permissions:
      contents: read
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          dissociate: true

      - name: Setup Nix and caching
        id: setup-nix
        uses: formancehq/ci/actions/setup-nix@main
        with:
          nscloud-cache: 'true'
          nix-extra-flags: ${{ inputs.nix-extra-flags }}
          git-private-token: ${{ secrets.GIT_PRIVATE_TOKEN }}
          skip-go: ${{ inputs.skip-go }}

      - name: Get pnpm store path
        if: inputs.pnpm-cache
        id: pnpm-store
        run: echo "path=$(nix develop --impure $NIX_EXTRA_FLAGS --command pnpm store path)" >> "$GITHUB_OUTPUT"
        env:
          NIX_EXTRA_FLAGS: ${{ inputs.nix-extra-flags }}

      - name: Cache pnpm store
        if: inputs.pnpm-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Run tests
        run: |
          if [ -n "$COMMAND" ]; then
            nix develop --impure $NIX_EXTRA_FLAGS --command bash -c "$COMMAND"
          else
            nix develop --impure $NIX_EXTRA_FLAGS --command just $TEST_TARGET
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          NIX_EXTRA_FLAGS: ${{ inputs.nix-extra-flags }}
          TEST_TARGET: ${{ inputs.test-target }}
          COMMAND: ${{ inputs.command }}

      - name: Run extra test targets
        if: inputs.extra-test-targets != '' && inputs.command == ''
        shell: bash
        run: |
          for target in $EXTRA_TEST_TARGETS; do
            echo "::group::just $target"
            nix develop --impure $NIX_EXTRA_FLAGS --command just "$target"
            echo "::endgroup::"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          NIX_EXTRA_FLAGS: ${{ inputs.nix-extra-flags }}
          EXTRA_TEST_TARGETS: ${{ inputs.extra-test-targets }}

      - name: Upload coverage to Codecov
        if: inputs.enable-codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ inputs.coverage-files }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report CI metrics
        if: always() && inputs.metrics-push-endpoint != ''
        uses: formancehq/ci/actions/report-ci-metrics@main
        with:
          skip-go: ${{ inputs.skip-go }}
          nix-extra-flags: ${{ inputs.nix-extra-flags }}
          push-endpoint: ${{ inputs.metrics-push-endpoint }}
          push-token: ${{ secrets.CI_METRICS_TOKEN }}
          test-results: ${{ inputs.test-results }}
          nix-cache-hit: ${{ steps.setup-nix.outputs.nix-cache-hit }}
          go-cache-hit: ${{ steps.setup-nix.outputs.go-cache-hit }}
