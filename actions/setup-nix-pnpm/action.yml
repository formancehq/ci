name: Setup Nix (pnpm)
description: Install Nix with flake caching and pnpm store cache for JS/TS repos

inputs:
  nix-extra-flags:
    description: Extra flags for nix develop
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Cache Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: |
          nix-${{ runner.os }}-${{ runner.arch }}-

    - name: Warm devshell
      shell: bash
      env:
        NIX_EXTRA_FLAGS: ${{ inputs.nix-extra-flags }}
      run: nix develop --impure $NIX_EXTRA_FLAGS --command echo "devshell ready"

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      env:
        NIX_EXTRA_FLAGS: ${{ inputs.nix-extra-flags }}
      run: echo "path=$(nix develop --impure $NIX_EXTRA_FLAGS --command pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-
