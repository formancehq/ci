name: Docker Manifest
description: Create and push a multi-arch Docker manifest from per-arch images

inputs:
  image:
    description: Full image name without tag (e.g. ghcr.io/formancehq/console-v3)
    required: true
  tag:
    description: Manifest tag (e.g. v1.2.3 or a commit SHA)
    required: true
  arch-tags:
    description: |
      Per-architecture image references (one per line).
      Example:
        ghcr.io/formancehq/console-v3:abc123_linux_amd64
        ghcr.io/formancehq/console-v3:abc123_linux_arm64
    required: true
  token:
    description: GitHub token for GHCR authentication
    required: true
  login-username:
    description: GHCR login username
    required: false
    default: ${{ github.actor }}

runs:
  using: composite
  steps:
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.login-username }}
        password: ${{ inputs.token }}

    - name: Create and push manifest
      shell: bash
      env:
        MANIFEST_REF: ${{ inputs.image }}:${{ inputs.tag }}
        ARCH_TAGS: ${{ inputs.arch-tags }}
      run: |
        mapfile -t images < <(printf '%s\n' "$ARCH_TAGS" | sed '/^[[:space:]]*$/d')
        docker manifest rm "$MANIFEST_REF" 2>/dev/null || true
        docker manifest create "$MANIFEST_REF" "${images[@]}"
        docker manifest push "$MANIFEST_REF"
