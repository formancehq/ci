name: Docker Build and Push
description: Build and push a Docker image to GHCR

inputs:
  image:
    description: Full image name (e.g. ghcr.io/formancehq/connectivity)
    required: true
  dockerfile:
    description: Path to Dockerfile
    required: false
    default: 'Dockerfile'
  context:
    description: Docker build context
    required: false
    default: '.'
  platforms:
    description: Target platforms (e.g. linux/amd64,linux/arm64 or linux/amd64)
    required: false
    default: 'linux/amd64,linux/arm64'
  push:
    description: Push the image
    required: false
    default: 'false'
  tag-rules:
    description: |
      docker/metadata-action tag rules (one per line).
      Default produces SHA-prefixed tag + latest on default branch.
    required: false
    default: |
      type=sha,prefix=
      type=raw,value=latest,enable={{is_default_branch}}
  tags:
    description: Explicit image tags (one per line). Overrides tag-rules when set.
    required: false
    default: ''
  build-args:
    description: Docker build args (one per line, KEY=VALUE)
    required: false
    default: ''
  target:
    description: Docker build target stage
    required: false
    default: ''
  token:
    description: GitHub token for GHCR authentication
    required: true
  login-username:
    description: GHCR login username
    required: false
    default: ${{ github.actor }}
  buildx-setup:
    description: |
      How to set up buildx:
        qemu     — QEMU + docker buildx (default, works everywhere)
        namespace — Namespace remote builders (native multi-arch, no emulation)
        none     — skip setup (caller already configured buildx)
    required: false
    default: 'qemu'
  outputs:
    description: |
      BuildKit output mode (passed to build-push-action outputs input).
      Use 'type=cacheonly' for PR builds that validate but don't push.
    required: false
    default: ''

outputs:
  digest:
    description: Image digest
    value: ${{ steps.build.outputs.digest }}
  metadata:
    description: Build metadata JSON
    value: ${{ steps.build.outputs.metadata }}
  tags:
    description: Resolved image tags
    value: ${{ steps.meta.outputs.tags || inputs.tags }}

runs:
  using: composite
  steps:
    - name: Set up QEMU
      if: inputs.buildx-setup == 'qemu'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx (standard)
      if: inputs.buildx-setup == 'qemu'
      uses: docker/setup-buildx-action@v4

    - name: Set up Docker Buildx (Namespace)
      if: inputs.buildx-setup == 'namespace'
      uses: namespacelabs/nscloud-setup-buildx-action@v0.0.23

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.login-username }}
        password: ${{ inputs.token }}

    - name: Docker metadata
      id: meta
      if: inputs.tags == ''
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.image }}
        tags: ${{ inputs.tag-rules }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        provenance: false
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tags || steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        target: ${{ inputs.target || '' }}
        outputs: ${{ inputs.outputs || '' }}
