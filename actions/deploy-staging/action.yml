name: Deploy to Staging
description: Connect to Tailscale (OIDC) and deploy a component to staging via ArgoCD

inputs:
  component:
    description: Component name (used in default parameter as versions.files.default.<component>=<tag>)
    required: false
    default: ''
  tag:
    description: Image tag to deploy (typically github.sha)
    required: true
  auth-token:
    description: ArgoCD auth token
    required: true
  application:
    description: ArgoCD application name
    required: false
    default: staging-eu-west-1-hosting-regions
  parameter:
    description: "ArgoCD parameter(s): one per line or single value (overrides default versions.files.default.<component>=<tag>)"
    required: false
    default: ''
  source-position:
    description: ArgoCD --source-position value (omitted if empty)
    required: false
    default: ''
  ts-oauth-client-id:
    description: Tailscale OIDC OAuth client ID
    required: true
  ts-audience:
    description: Tailscale OIDC audience
    required: true
  ts-tags:
    description: Tailscale tags (required for OIDC auth)
    required: true
  ts-version:
    description: Tailscale version
    required: false
    default: ''
  ts-args:
    description: Tailscale extra args
    required: false
    default: ''
  ts-retry:
    description: Tailscale retry count
    required: false
    default: ''
  ts-timeout:
    description: Tailscale timeout
    required: false
    default: ''
  ts-ping:
    description: Tailscale ping target
    required: false
    default: ''
  skip-sync:
    description: Skip app sync (set to true when chaining multiple app set calls)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        audience: ${{ inputs.ts-audience }}
        tags: ${{ inputs.ts-tags }}
        version: ${{ inputs.ts-version }}
        args: ${{ inputs.ts-args }}
        retry: ${{ inputs.ts-retry }}
        timeout: ${{ inputs.ts-timeout }}
        ping: ${{ inputs.ts-ping }}

    - name: Install ArgoCD CLI
      shell: bash
      env:
        ARGOCD_VERSION: v3.1.8
        ARGOCD_CHECKSUM: bfc45149df6dc8408cee3c1c66e865adde1439d8f419657513b56704d73f1e4d
      run: |
        curl -sSL -o "$RUNNER_TEMP/argocd" "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
        echo "${ARGOCD_CHECKSUM}  $RUNNER_TEMP/argocd" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/argocd"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Deploy to staging
      shell: bash
      run: |
        if [ -z "$COMPONENT" ] && [ -z "$PARAMETER" ]; then
          echo "::error::Either 'component' or 'parameter' input is required"
          exit 1
        fi
        SERVER=argocd.internal.formance.cloud
        SOURCE_POS="${SOURCE_POSITION:+--source-position $SOURCE_POSITION}"
        PARAMS=()
        if [ -n "$PARAMETER" ]; then
          while IFS= read -r line; do
            [ -n "$line" ] && PARAMS+=(-p "$line")
          done <<< "$PARAMETER"
        else
          PARAMS=(-p "versions.files.default.$COMPONENT=$TAG")
        fi
        argocd --auth-token="$AUTH_TOKEN" --server="$SERVER" --grpc-web app set "$APP" "${PARAMS[@]}" $SOURCE_POS
        if [ "$SKIP_SYNC" != "true" ]; then
          argocd --auth-token="$AUTH_TOKEN" --server="$SERVER" --grpc-web app sync "$APP"
        fi
      env:
        AUTH_TOKEN: ${{ inputs.auth-token }}
        APP: ${{ inputs.application }}
        COMPONENT: ${{ inputs.component }}
        TAG: ${{ inputs.tag }}
        PARAMETER: ${{ inputs.parameter }}
        SOURCE_POSITION: ${{ inputs.source-position }}
        SKIP_SYNC: ${{ inputs.skip-sync }}
