name: Setup Nix
description: Install Nix, extract Go environment, and configure Namespace runner caching

inputs:
  nscloud-cache:
    description: Enable Namespace.so Go and lint caching
    required: false
    default: 'true'
  cache-nix-store:
    description: Cache /nix store via Namespace (defaults to nscloud-cache value)
    required: false
    default: ''
  cache-golangci-lint:
    description: Include ~/.cache/golangci-lint in the Namespace cache
    required: false
    default: 'true'
  nix-extra-flags:
    description: Extra flags for nix develop
    required: false
    default: ''
  git-private-token:
    description: GitHub PAT for private formancehq repo access
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Cache Nix store
      if: (inputs.cache-nix-store != '' && inputs.cache-nix-store != 'false') || (inputs.cache-nix-store == '' && inputs.nscloud-cache != 'false')
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        path: /nix

    - name: Install Nix
      uses: cachix/install-nix-action@v31

    - name: Configure Git for private repos
      if: inputs.git-private-token != ''
      shell: bash
      env:
        GIT_PRIVATE_TOKEN: ${{ inputs.git-private-token }}
      run: git config --global url."https://${GIT_PRIVATE_TOKEN}@github.com/formancehq/".insteadOf "https://github.com/formancehq/"

    - name: Extract Go environment
      id: go-env
      shell: bash
      env:
        NIX_EXTRA_FLAGS: ${{ inputs.nix-extra-flags }}
      run: |
        nix develop --impure $NIX_EXTRA_FLAGS --command sh -c 'go env | sed -E "s/^([^=]+)='"'"'(.*)'"'"'$/\1=\2/" > /tmp/goenv.txt'
        cat /tmp/goenv.txt >> "$GITHUB_OUTPUT"

    - name: Cache Go modules and build artifacts
      if: inputs.nscloud-cache != 'false'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        path: |
          ${{ steps.go-env.outputs.GOCACHE }}
          ${{ steps.go-env.outputs.GOMODCACHE }}
          ${{ inputs.cache-golangci-lint != 'false' && '~/.cache/golangci-lint' || '' }}
